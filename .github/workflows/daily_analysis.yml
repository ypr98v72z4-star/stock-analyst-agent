name: Daily Stock Analysis

on:
  schedule:
    # A股收盘后 15:30 CST (07:30 UTC)
    - cron: '30 7 * * 1-5'
    # 港股收盘后 16:30 HKT (08:30 UTC)
    - cron: '30 8 * * 1-5'
    # 美股收盘后 04:30 HKT (20:30 UTC, 前一天)
    - cron: '30 20 * * 1-5'
  workflow_dispatch:  # 允许手动触发

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run stock analysis
      env:
        HERMES_ENDPOINT: ${{ secrets.HERMES_ENDPOINT }}
        HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      run: |
        python main.py
    
    - name: Commit and push reports
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add reports/ data/
        git diff --staged --quiet || git commit -m "Add daily report $(date +%Y-%m-%d)"
        git push
