# ============================================================
# 股票分析助手 - 配置文件
# ============================================================

# 股票池
watchlist:
  # A股 (yfinance: 上海 .SS, 深圳 .SZ)
  cn:
    - symbol: "000858.SZ"
      name: "五粮液"
    - symbol: "600436.SS"
      name: "片仔癀"
    - symbol: "000878.SZ"
      name: "云南铜业"
  # 港股
  hk:
    - symbol: "9988.HK"
      name: "阿里巴巴"
    - symbol: "0700.HK"
      name: "腾讯控股"
    - symbol: "6055.HK"
      name: "中烟香港"
    - symbol: "2313.HK"
      name: "申洲国际"
    - symbol: "0981.HK"
      name: "中芯国际"
  # 美股
  us:
    - symbol: "AAPL"
      name: "苹果"
    - symbol: "MSFT"
      name: "微软"
    - symbol: "TSLA"
      name: "特斯拉"
    - symbol: "GOOGL"
      name: "谷歌"
    - symbol: "AMZN"
      name: "亚马逊"
    - symbol: "XBI"
      name: "美国生科ETF-SPDR"
    - symbol: "NVDA"
      name: "英伟达"

# 市场指数基准
benchmarks:
  - symbol: "000001.SS"
    name: "上证指数"
  - symbol: "399001.SZ"
    name: "深证成指"
  - symbol: "^HSI"
    name: "恒生指数"
  - symbol: "^HSCE"
    name: "恒生中国企业指数"
  - symbol: "^GSPC"
    name: "S&P 500"
  - symbol: "^IXIC"
    name: "纳斯达克"

# 数据源配置
data_sources:
  # Yahoo Finance (免费, 通过 yfinance)
  market_data:
    provider: "yfinance"
    period: "5d"           # 拉取最近5天数据用于计算指标
    interval: "1d"

  # 新闻/公告 (可替换为其他源)
  news:
    provider: "yfinance"   # yfinance 自带新闻
    max_per_stock: 5

# Hermes 配置
hermes:
  # 云端 API 或自托管 endpoint
  endpoint: "${HERMES_ENDPOINT}"       # 环境变量注入
  api_key: "${HERMES_API_KEY}"         # 环境变量注入
  model: "hermes-3-llama-3.1-405b"    # 或你部署的模型
  temperature: 0.3
  max_tokens: 2048

# 报告配置
report:
  output_dir: "reports"
  format: "markdown"
  # 企业微信 Webhook (用于 Hermes 推送)
  wecom_webhook: "${WECOM_WEBHOOK_URL}"

# 调度配置
schedule:
  timezone: "Asia/Hong_Kong"
  # 港股收盘后 16:30 HKT
  hk_market_close: "16:30"
  # 美股收盘后 04:30 HKT (次日)
  us_market_close: "04:30"
